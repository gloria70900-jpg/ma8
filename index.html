<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Crystal Alchemy</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; color: white;}
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, #1a1a3a 0%, #000 100%); z-index: 100;
        }
        .upload-btn {
            position: relative; overflow: hidden; display: inline-block;
            padding: 20px 40px; background: linear-gradient(45deg, #0055ff, #00d4ff);
            color: white; font-size: 24px; font-weight: bold; border-radius: 50px;
            cursor: pointer; transition: transform 0.2s; box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
        }
        .upload-btn:hover { transform: scale(1.05); }
        .upload-btn input[type=file] {
            font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer;
        }
        #instructions { margin-top: 30px; text-align: center; line-height: 1.8; color: #ccc; }
        #loading { display: none; margin-top: 20px; font-size: 20px; color: #00d4ff; }
        
        #hud {
            position: absolute; top: 10px; width: 100%; text-align: center;
            pointer-events: none; z-index: 50; display: none; text-shadow: 0 0 5px #000; font-size: 18px;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h1>Crystal Alchemy: The Blueprint</h1>
        <div class="upload-btn">
            <span>MP3 파일 선택하여 의식 시작</span>
            <input type="file" id="audioInput" accept="audio/*">
        </div>
        <div id="loading">오디오 분석 중... 잠시만 기다려주세요.</div>
        <div id="instructions">
            <strong>[조작 방법]</strong><br>
            <strong>PC:</strong> [좌클릭] = 180도 공중 분산 토글 / [우클릭] = 가루 파편 폭발 토글<br>
            <strong>VR 기기:</strong> [A / X 버튼] = 180도 분산 / [B / Y 버튼] = 가루 폭발(돔 별자리)<br>
            [조이스틱] = 물체 상하(원근) 및 좌우 이동
        </div>
    </div>

    <div id="hud">PC: 마우스 드래그로 회전 | 좌클릭: 분산 / 우클릭: 폭발 (현재 상태: CLUSTER)</div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let audioCtx, analyser, dataArray;
        
        let currentState = 'CLUSTER'; 
        let worldGroup;

        // 수정 기둥 변수
        const CRYSTAL_COUNT = 200;
        let crystalMesh, dummy;
        let currentPos = [], currentQuat = [];
        let clusterPos = [], clusterQuat = [];
        let dispersePos = [], disperseQuat = [];

        // 가루/파편 돔(Dome) 변수
        let particleSystem;
        const PARTICLE_COUNT = 20000;
        let pPositions, pVelocities;
        const DOME_RADIUS = 40.0; // 별자리처럼 박힐 거대한 돔의 반경
        
        const prevButtonState = { A: false, B: false };
        const clock = new THREE.Clock();

        // 오리지널 파란색의 명도/채도를 기준으로 색상(Hue)만 변경
        let currentHue = 0.6; // 0.6은 파란색
        const baseSat = 0.9;  // 높은 채도 유지
        const baseLight = 0.2; // 깊이감 있는 명도 유지

        initThreeJS();

        // 30여 가지 색깔 랜덤화 함수 (명도, 채도는 고정하여 아름다운 색감 보존)
        function randomizeCrystalColor() {
            // 0 ~ 29 중 하나의 스텝을 선택하여 30가지 스펙트럼(빨주노초파남보핑크 등) 생성
            const step = Math.floor(Math.random() * 30);
            currentHue = step / 30.0; 
            
            // 다이아몬드 자체의 발광(Emissive)도 해당 색상에 맞춰 영롱하게 업데이트
            crystalMesh.material.emissive.setHSL(currentHue, baseSat, 0.15);
        }

        document.getElementById('audioInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('loading').style.display = 'block';
            
            const reader = new FileReader();
            reader.onload = function(e) {
                initAudio(e.target.result);
            };
            reader.readAsArrayBuffer(file);
        });

        function initAudio(arrayBuffer) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.decodeAudioData(arrayBuffer, function(buffer) {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                source.loop = true;
                source.start(0);
                
                document.getElementById('ui').style.display = 'none';
                document.getElementById('hud').style.display = 'block';
                document.body.appendChild(VRButton.createButton(renderer));
                
                animate();
            });
        }

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000511, 0.03); // 안개를 살짝 옅게 조정하여 돔이 잘 보이게 함

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 1); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.5, -3);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0x224488, 1.0);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0x00aaff, 5, 20);
            pointLight.position.set(0, 2, -2);
            scene.add(pointLight);

            worldGroup = new THREE.Group();
            scene.add(worldGroup);

            dummy = new THREE.Object3D();

            createCrystals();
            createParticles();

            window.addEventListener('contextmenu', (e) => e.preventDefault());
            
            window.addEventListener('mousedown', (e) => {
                if (e.button === 0) {
                    toggleDisperse();
                } else if (e.button === 2) {
                    toggleShatter();
                }
            });

            window.addEventListener('resize', onWindowResize);
            
            // 초기 색상 세팅
            crystalMesh.material.emissive.setHSL(currentHue, baseSat, 0.15);
        }

        function createCrystals() {
            const geometry = new THREE.OctahedronGeometry(0.3, 0);
            geometry.scale(0.8, 4.0, 0.8);

            // 베이스를 화이트로 두고 setColorAt과 emissive로 색감을 표현
            const material = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0x000000, 
                roughness: 0.1,
                metalness: 0.8,
                transparent: true,
                opacity: 0.9
            });

            crystalMesh = new THREE.InstancedMesh(geometry, material, CRYSTAL_COUNT);
            worldGroup.add(crystalMesh);

            const centerPoint = new THREE.Vector3(0, 1.5, -4);

            for (let i = 0; i < CRYSTAL_COUNT; i++) {
                const phi = Math.acos(-1 + (2 * i) / CRYSTAL_COUNT);
                const theta = Math.sqrt(CRYSTAL_COUNT * Math.PI) * phi;
                
                let r = 1.0 + Math.random() * 0.5;
                let cx = r * Math.cos(theta) * Math.sin(phi);
                let cy = r * Math.sin(theta) * Math.sin(phi);
                let cz = r * Math.cos(phi);
                
                const cPos = new THREE.Vector3(cx, cy, cz).add(centerPoint);
                clusterPos.push(cPos);

                dummy.position.copy(centerPoint);
                dummy.lookAt(cPos);
                dummy.rotateX(Math.PI / 2);
                clusterQuat.push(dummy.quaternion.clone());

                const angle = (Math.random() - 0.5) * Math.PI;
                const radius = 3 + Math.random() * 4;
                const height = 0.5 + Math.random() * 3.5;

                const dPos = new THREE.Vector3(
                    Math.sin(angle) * radius,
                    height,
                    -Math.cos(angle) * radius
                );
                dispersePos.push(dPos);
                
                dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                disperseQuat.push(dummy.quaternion.clone());

                currentPos.push(cPos.clone());
                currentQuat.push(dummy.quaternion.clone());
            }
        }

        function createParticles() {
            const geo = new THREE.BufferGeometry();
            pPositions = new Float32Array(PARTICLE_COUNT * 3);
            pVelocities = new Float32Array(PARTICLE_COUNT * 3);
            
            geo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
            
            const mat = new THREE.PointsMaterial({
                color: 0xffffff, size: 0.08, // 별처럼 보이도록 크기 살짝 증가
                transparent: true, opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particleSystem = new THREE.Points(geo, mat);
            particleSystem.visible = false;
            worldGroup.add(particleSystem);
        }

        function toggleDisperse() {
            if (currentState === 'SHATTERED') return; 
            
            if (currentState === 'CLUSTER') {
                currentState = 'DISPERSED';
            } else {
                currentState = 'CLUSTER';
                randomizeCrystalColor(); // 뭉칠 때마다 새로운 랜덤 색상
            }
            updateHUD();
        }

        function toggleShatter() {
            if (currentState !== 'SHATTERED') {
                currentState = 'SHATTERED';
                crystalMesh.visible = false;
                particleSystem.visible = true;
                
                // 파편 색상을 현재 크리스탈 색상과 완벽히 동일하게 동기화
                const pColor = new THREE.Color();
                pColor.setHSL(currentHue, 1.0, 0.6); // 밝고 선명한 원본 색상 발산
                particleSystem.material.color = pColor;
                
                for (let i = 0; i < CRYSTAL_COUNT; i++) {
                    const basePos = currentPos[i];
                    for (let j = 0; j < 100; j++) {
                        const idx = (i * 100 + j) * 3;
                        // 초기 위치는 크리스탈 위치
                        pPositions[idx] = basePos.x + (Math.random()-0.5)*0.5;
                        pPositions[idx+1] = basePos.y + (Math.random()-0.5)*0.5;
                        pPositions[idx+2] = basePos.z + (Math.random()-0.5)*0.5;
                        
                        // 우주 돔으로 뻗어나가는 폭발 방향 설정 (전방위 구체 형태)
                        const dir = new THREE.Vector3(
                            (Math.random() - 0.5),
                            (Math.random() - 0.3), // 약간 위쪽 위주로 퍼지게
                            (Math.random() - 0.5)
                        ).normalize();
                        
                        // 엄청난 속도로 폭발하여 돔을 향해 날아감
                        const speed = 40.0 + Math.random() * 60.0; 
                        pVelocities[idx] = dir.x * speed;
                        pVelocities[idx+1] = dir.y * speed;
                        pVelocities[idx+2] = dir.z * speed;
                    }
                }
            } else {
                currentState = 'CLUSTER';
                crystalMesh.visible = true;
                particleSystem.visible = false;
                randomizeCrystalColor(); // 다시 복구되면서 색상 체인지
            }
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('hud').innerText = `PC: 마우스 드래그로 회전 | 좌클릭: 180도 분산 / 우클릭: 폭발 (현재 상태: ${currentState})`;
        }

        function handleGamepadInput() {
            const session = renderer.xr.getSession();
            if (!session) return;
            
            let currentA = false;
            let currentB = false;
            
            for (const source of session.inputSources) {
                if (!source.gamepad) continue;
                
                if (source.gamepad.buttons[4] && source.gamepad.buttons[4].pressed) currentA = true;
                if (source.gamepad.buttons[5] && source.gamepad.buttons[5].pressed) currentB = true;

                if (source.gamepad.axes.length >= 4) {
                    const axesX = source.gamepad.axes[2]; 
                    const axesY = source.gamepad.axes[3]; 
                    
                    if (Math.abs(axesX) > 0.1) {
                        worldGroup.position.x += axesX * 0.05; 
                    }
                    if (Math.abs(axesY) > 0.1) {
                        worldGroup.position.z += axesY * 0.05; 
                    }
                }
            }

            if (currentA && !prevButtonState.A) toggleDisperse();
            if (currentB && !prevButtonState.B) toggleShatter();

            prevButtonState.A = currentA;
            prevButtonState.B = currentB;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            controls.update();
            handleGamepadInput();

            let audioIntensity = 0;
            if (analyser) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for(let i=0; i<30; i++) sum += dataArray[i];
                audioIntensity = sum / (30 * 255);
            }

            // --- 1. 크리스탈 렌더링 ---
            if (crystalMesh.visible) {
                for (let i = 0; i < CRYSTAL_COUNT; i++) {
                    const tPos = (currentState === 'CLUSTER') ? clusterPos[i] : dispersePos[i];
                    const tQuat = (currentState === 'CLUSTER') ? clusterQuat[i] : disperseQuat[i];

                    currentPos[i].lerp(tPos, delta * 3.0);
                    currentQuat[i].slerp(tQuat, delta * 3.0);

                    dummy.position.copy(currentPos[i]);
                    dummy.quaternion.copy(currentQuat[i]);
                    
                    const scale = 1.0 + audioIntensity * 0.5;
                    dummy.scale.set(scale, scale, scale);
                    
                    if (currentState === 'DISPERSED') {
                        dummy.position.y += Math.sin(time * 2 + i) * 0.02; 
                        dummy.rotateY(delta * 0.5);
                        currentQuat[i].copy(dummy.quaternion);
                    }

                    dummy.updateMatrix();
                    crystalMesh.setMatrixAt(i, dummy.matrix);
                    
                    // 명도와 채도는 고정하고 사운드에 맞춰 빛 밝기(Lightness)만 살짝 펌핑
                    const color = new THREE.Color();
                    color.setHSL(currentHue, baseSat, baseLight + (audioIntensity * 0.4));
                    crystalMesh.setColorAt(i, color);
                }
                crystalMesh.instanceMatrix.needsUpdate = true;
                if(crystalMesh.instanceColor) crystalMesh.instanceColor.needsUpdate = true;
            }

            // --- 2. 파편(가루) 렌더링 : 거대한 돔 별자리 물리 ---
            if (particleSystem.visible) {
                // 오디오에 반응하여 돔에 박힌 별들이 반짝이는(Twinkle) 효과
                particleSystem.material.opacity = 0.5 + (audioIntensity * 0.5);

                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    let idx = i * 3;
                    
                    let vx = pVelocities[idx];
                    let vy = pVelocities[idx+1];
                    let vz = pVelocities[idx+2];
                    
                    // 속도가 0이라면 이미 돔에 박힌 상태 (움직이지 않음)
                    if (vx === 0 && vy === 0 && vz === 0) continue;
                    
                    let px = pPositions[idx] + vx * delta;
                    let py = pPositions[idx+1] + vy * delta;
                    let pz = pPositions[idx+2] + vz * delta;
                    
                    // 돔 반경에 도달했는지 확인 (원점에서부터의 거리)
                    const distSq = px*px + py*py + pz*pz;
                    if (distSq >= DOME_RADIUS * DOME_RADIUS) {
                        // 돔 표면에 정착 (별처럼 박힘)
                        const dist = Math.sqrt(distSq);
                        pPositions[idx] = (px / dist) * DOME_RADIUS;
                        pPositions[idx+1] = (py / dist) * DOME_RADIUS;
                        pPositions[idx+2] = (pz / dist) * DOME_RADIUS;
                        
                        // 더 이상 이동하지 않도록 속도 제거
                        pVelocities[idx] = 0;
                        pVelocities[idx+1] = 0;
                        pVelocities[idx+2] = 0;
                    } else {
                        // 날아가는 중
                        pPositions[idx] = px;
                        pPositions[idx+1] = py;
                        pPositions[idx+2] = pz;
                    }
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
